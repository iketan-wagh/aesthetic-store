[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[phases.build]
cmds = [
  "python manage.py collectstatic --no-input"
]

[start]
cmd = "python manage.py migrate --no-input && python manage.py seed_data && gunicorn config.wsgi:application"
