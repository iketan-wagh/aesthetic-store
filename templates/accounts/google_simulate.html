{% extends 'base.html' %}
{% load static %}

{% block title %}Sign in with Google | Aesthetic Store{% endblock %}

{% block content %}
<div class="bg-[#FAF8F5] py-16 sm:py-24">
  <div class="max-w-md mx-auto px-4 sm:px-6">
    
    <div class="bg-white p-8 sm:p-10 rounded-3xl border border-[#ECE6DB] shadow-lg space-y-6 text-center">
      
      <!-- Google Logo Icon -->
      <div class="w-16 h-16 mx-auto rounded-full bg-[#FAF8F5] border border-[#ECE6DB] flex items-center justify-center shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
          <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
          <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
          <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
        </svg>
      </div>

      <div class="space-y-1">
        <h1 class="font-serif text-2xl font-bold text-neutral-900">Sign in with Google</h1>
        <p class="text-xs text-neutral-500 font-light">to continue to <strong>Aesthetic Store</strong></p>
      </div>

      <!-- Quick Google Account Chooser -->
      <form method="POST" action="{% url 'accounts:google_callback' %}" class="space-y-4 text-left">
        {% csrf_token %}
        <input type="hidden" name="state" value="{{ state }}">

        <div>
          <label class="block text-xs font-semibold text-neutral-700 mb-1">Google Account Email</label>
          <input type="email" name="email" value="google.user@gmail.com" required class="form-input text-xs">
        </div>

        <div>
          <label class="block text-xs font-semibold text-neutral-700 mb-1">Your Full Name</label>
          <input type="text" name="first_name" value="Ananya Sharma" required class="form-input text-xs">
        </div>

        <button type="submit" class="w-full bg-[#1C1B19] hover:bg-[#C86D51] text-white py-3.5 px-4 rounded-full text-xs font-semibold tracking-wider uppercase transition flex items-center justify-center gap-2 shadow-md">
          Continue with Google Account ✦
        </button>
      </form>

      <div class="pt-2 text-[11px] text-neutral-400">
        <a href="{% url 'accounts:login' %}" class="hover:underline">← Cancel and return to sign in</a>
      </div>

    </div>

  </div>
</div>
{% endblock %}
